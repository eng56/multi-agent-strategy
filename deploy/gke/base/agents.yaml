---
apiVersion: apps/v1
kind: Deployment
metadata: {name: planner-agent}
spec:
  replicas: 1
  selector: {matchLabels: {app: planner-agent}}
  template:
    metadata: {labels: {app: planner-agent}}
    spec:
      serviceAccountName: agent-runtime
      containers:
        - name: app
          image: APP_IMAGE
          command: ["python", "-m", "src.worker"]
          env:
            - {name: AGENT_ROLE, value: planner-agent}
          envFrom: [{configMapRef: {name: runtime-config}}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts: [{name: managed-secrets, mountPath: /var/secrets, readOnly: true}]
      volumes: [{name: managed-secrets, csi: {driver: secrets-store-gke.csi.k8s.io, readOnly: true, volumeAttributes: {secretProviderClass: runtime-managed-secrets}}}]
