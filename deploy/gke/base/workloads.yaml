apiVersion: apps/v1
kind: Deployment
metadata: {name: orchestrator-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: orchestrator-api}}
  template:
    metadata: {labels: {app: orchestrator-api}}
    spec:
      serviceAccountName: agent-runtime
      containers:
        - name: app
          image: APP_IMAGE
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: runtime-config}}]
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: 1, memory: 1Gi}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 15}
          volumeMounts: [{name: managed-secrets, mountPath: /var/secrets, readOnly: true}]
      volumes: [{name: managed-secrets, csi: {driver: secrets-store-gke.csi.k8s.io, readOnly: true, volumeAttributes: {secretProviderClass: runtime-managed-secrets}}}]
---
apiVersion: v1
kind: Service
metadata: {name: orchestrator-api}
spec:
  type: LoadBalancer
  selector: {app: orchestrator-api}
  ports: [{port: 80, targetPort: 8080}]
