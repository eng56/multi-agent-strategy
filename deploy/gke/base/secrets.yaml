# Requires the GKE Secret Manager add-on. Values stay in Google Secret Manager.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: runtime-managed-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/runtime-env/versions/latest"
        path: "runtime-env"
