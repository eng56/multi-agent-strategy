name: Deploy Vercel Frontend
on:
  push: {branches: [main], paths: ["frontend/**"]}
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel deployment settings
        id: vercel-settings
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'configured=false\n' >> "$GITHUB_OUTPUT"
            printf '::notice title=Vercel deploy skipped::Missing settings: %s. Add VERCEL_TOKEN plus VERCEL_ORG_ID and VERCEL_PROJECT_ID, or rely on Vercel Git integration for frontend deploys.\n' "${missing[*]}"
            exit 0
          fi
          printf 'configured=true\n' >> "$GITHUB_OUTPUT"
      - if: steps.vercel-settings.outputs.configured == 'true'
        run: npm install -g vercel@latest
      - if: steps.vercel-settings.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}
      - if: steps.vercel-settings.outputs.configured == 'true'
        run: vercel build --prod --token=${{ env.VERCEL_TOKEN }}
      - if: steps.vercel-settings.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ env.VERCEL_TOKEN }}
        env: {VERCEL_ORG_ID: "${{ env.VERCEL_ORG_ID }}", VERCEL_PROJECT_ID: "${{ env.VERCEL_PROJECT_ID }}"}
