name: Production Smoke Test
"on":
  workflow_dispatch: {}
permissions: {contents: read, id-token: write}
jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: Production
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GKE_CLUSTER: ${{ vars.GKE_CLUSTER || secrets.GKE_CLUSTER }}
      GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production smoke variables
        run: |
          missing=()
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT GKE_CLUSTER GCP_REGION GCP_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - uses: google-github-actions/auth@v3
        with: {workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}"}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: google-github-actions/get-gke-credentials@v3
        with: {cluster_name: "${{ env.GKE_CLUSTER }}", location: "${{ env.GCP_REGION }}"}
      - name: Read runtime endpoint and token without printing secrets
        run: |
          api_ip="$(kubectl get service orchestrator-api -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          if [ -z "$api_ip" ]; then
            echo "orchestrator-api LoadBalancer IP is empty" >&2
            exit 1
          fi
          token="$(
            kubectl exec deploy/orchestrator-api -- python -c 'from pathlib import Path
for line in Path("/var/secrets/runtime-env").read_text().splitlines():
    if line.startswith("ORCHESTRATOR_API_TOKEN="):
        print(line.split("=", 1)[1].strip())
        break'
          )"
          if [ -z "$token" ]; then
            echo "ORCHESTRATOR_API_TOKEN was not found in mounted runtime-env" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          {
            echo "ORCHESTRATOR_API_URL=http://${api_ip}"
            echo "ORCHESTRATOR_API_TOKEN=${token}"
            echo "SMOKE_OUTPUT_PATH=.codex-loop/latest-smoke-run-detail.json"
            echo "SMOKE_TIMEOUT_SECONDS=600"
            echo "SMOKE_POLL_SECONDS=10"
          } >> "$GITHUB_ENV"
      - name: Run deployed smoke test
        run: bash scripts/smoke-run-fed-cut.sh
      - name: Prepare smoke artifact
        if: always()
        run: |
          mkdir -p smoke-artifacts
          if [ -f .codex-loop/latest-smoke-run-detail.json ]; then
            cp .codex-loop/latest-smoke-run-detail.json smoke-artifacts/deployed-smoke-run-detail.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-smoke-run-detail
          path: smoke-artifacts/
          if-no-files-found: ignore
