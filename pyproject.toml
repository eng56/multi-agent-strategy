[project]
name = "managed-multi-agent-strategy"
version = "0.1.0"
description = "Managed-services-only multi-agent strategy prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "google-cloud-storage>=2.18,<4",
  "confluent-kafka>=2.5,<3",
  "langfuse>=3,<4",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
